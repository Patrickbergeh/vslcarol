  <script type="text/javascript">
    /* ====== CONFIG ====== */
    var REVEAL_AT_SECONDS = 960; // tempo em segundos p/ o botão aparecer (960 = 16min)
    /* ==================== */

    (function () {
      var cta = document.getElementById("cta");
      var revealed = false;

      function reveal() {
        if (revealed) return;
        revealed = true;
        cta.classList.add("is-visible");
        // força o reflow p/ a transição rodar
        void cta.offsetWidth;
        cta.classList.add("is-shown");
      }

      // 1) Caminho oficial: escuta o timeupdate do SmartPlayer da vturb
      function hookPlayer() {
        try {
          var sp = window.smartplayer;
          var inst = sp && sp.instances && sp.instances[0];
          if (inst && typeof inst.on === "function") {
            inst.on("timeupdate", function () {
              var t = (inst.video && inst.video.currentTime) || inst.currentTime || 0;
              if (t >= REVEAL_AT_SECONDS) reveal();
            });
            return true;
          }
        } catch (e) {}
        return false;
      }

      // 2) Fallback: procura o <video> na página e lê o currentTime direto
      function hookVideoEl() {
        var v = document.querySelector("vturb-smartplayer video") ||
                document.querySelector("video");
        if (v) {
          v.addEventListener("timeupdate", function () {
            if (v.currentTime >= REVEAL_AT_SECONDS) reveal();
          });
          return true;
        }
        return false;
      }

      // tenta conectar até o player carregar
      var tries = 0;
      var timer = setInterval(function () {
        tries++;
        var ok = hookPlayer() || hookVideoEl();
        if (ok || tries > 120) clearInterval(timer); // desiste após ~60s
      }, 500);
    })();

    /* ====== Badge "assistindo ao vivo" ====== */
    (function () {
      var MIN = 134;  // mínimo de pessoas
      var MAX = 325;  // máximo de pessoas
      var el = document.getElementById("liveCount");
      if (!el) return;

      function rand(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      // número inicial aleatório dentro da faixa
      var current = rand(MIN, MAX);
      el.textContent = current;

      function tick() {
        // varia de forma sutil (±3 a ±18) pra parecer natural, dentro dos limites
        var delta = rand(3, 18) * (Math.random() < 0.5 ? -1 : 1);
        current = Math.min(MAX, Math.max(MIN, current + delta));
        el.textContent = current;

        // próximo update entre 2 e 3 minutos
        var nextMs = rand(120, 180) * 1000;
        setTimeout(tick, nextMs);
      }

      // agenda a primeira troca entre 2 e 3 min
      setTimeout(tick, rand(120, 180) * 1000);
    })();
  </script>
